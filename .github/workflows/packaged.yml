name: Packaged acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: packaged-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
          - os: macos-15
            bundle: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      XDG_CURRENT_DESKTOP: GNOME
      CHEM_EDITOR_BUNDLE_TARGETS: ${{ matrix.bundle }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      PACKAGE_CHECK_REPORT: ${{ github.workspace }}/package-check.json
      UI_CHECK_REPORT: ${{ github.workspace }}/ui-check.json
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf webkit2gtk-driver xvfb xdotool dbus-x11 xdg-desktop-portal-gtk
      - run: pnpm install --frozen-lockfile
      - name: Build actual bundle
        run: pnpm build:app
      - name: Archive macOS bundle with permissions and symlinks
        if: runner.os == 'macOS'
        run: tar -czf ChemEditor-macos-arm64.app.tar.gz -C src-tauri/target/release/bundle/macos ChemEditor.app
      - name: Record artifact hashes
        run: node scripts/hash-packages.mjs
      - name: Extract Debian package outside checkout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          install_root=$(mktemp -d)
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$install_root"
          echo "INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "APP_PATH=$install_root/usr/bin/chem-editor" >> "$GITHUB_ENV"
      - name: Install NSIS package outside checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ChemEditor-acceptance'
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)[0].FullName
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$root" -Wait
          "INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          "APP_PATH=$root/chem-editor.exe" >> $env:GITHUB_ENV
      - name: Copy macOS arm64 app outside checkout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          install_root=$(mktemp -d)
          ditto src-tauri/target/release/bundle/macos/ChemEditor.app "$install_root/ChemEditor.app"
          echo "INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
      - name: Check installed resources and cheap chemistry
        shell: bash
        run: node scripts/check-packaged-app.mjs "$INSTALL_ROOT"
      - name: Install native automation driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Install matching Edge driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = (Get-Item "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe").VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP/edge.zip"
          Expand-Archive "$env:RUNNER_TEMP/edge.zip" "$env:RUNNER_TEMP/edge-driver"
          "$env:RUNNER_TEMP/edge-driver" >> $env:GITHUB_PATH
      - name: Linux installed UI acceptance
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/test-packaged-ui.mjs "$APP_PATH"
      - name: Windows installed UI acceptance
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/test-packaged-ui.mjs "$APP_PATH"
      - name: Preserve packages and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            ChemEditor-macos-arm64.app.tar.gz
            package-hashes.json
            package-check.json
            ui-check.json
            native-ui-evidence/
          if-no-files-found: warn
