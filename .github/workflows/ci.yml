name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:js
      - run: pnpm lint:format
      - run: pnpm test:js
      - run: pnpm test:js:ui

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # No sidecar is needed: tauri.conf.json declares the sidecar under bundle.resources as a
      # glob (not externalBin), so cargo check/test/clippy compile without one.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  sidecar:
    name: Sidecar build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build the PyInstaller sidecar
        run: node src-tauri/build-sidecar.js
      - name: Smoke test the packaged binary
        run: |
          bin=$(ls -d src-tauri/bin/chem-engine-*-unknown-linux-gnu | head -n 1)/chem-engine
          "$bin" properties CCO | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'error' not in d, d"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lint
        run: |
          uvx ruff@0.16.2 check development/build_nmr_hose_db.py development/precompute_nmr_refs.py development/src_tauri_path.py src-tauri/bin/chem-engine.py src-tauri/bin/nmr_hose.py src-tauri/tests/test_nmr_hose.py
          uvx ruff@0.16.2 format --check development/build_nmr_hose_db.py src-tauri/bin/ src-tauri/tests/
      - name: Unit tests
        run: uv run --project src-tauri python -m unittest discover -s src-tauri/tests -p 'test_*.py'

  python-qm:
    name: Python QM integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --project src-tauri --group nmr-dft python -m unittest discover -s src-tauri/tests -p 'integration_*.py'
        env:
          OMP_NUM_THREADS: 2
